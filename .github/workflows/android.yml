name: Build Android APK/AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version name"
        default: "1.0.0"
      version_code:
        description: "App version code (integer)"
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_HOST: ${{ secrets.APP_HOST }}
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3

      - name: Validate secrets
        run: |
          test -n "$APP_HOST" || { echo "Missing APP_HOST secret"; exit 1; }
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$BUBBLEWRAP_KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Prepare manifest
        working-directory: android
        run: |
          sed -i "s#REPLACE_WITH_YOUR_DOMAIN#$APP_HOST#g" twa-manifest.json
          node -e "
            const fs=require('fs');const m=JSON.parse(fs.readFileSync('twa-manifest.json'));
            m.appVersionName='${{ github.event.inputs.version_name }}';
            m.appVersionCode=parseInt('${{ github.event.inputs.version_code }}')||1;
            fs.writeFileSync('twa-manifest.json',JSON.stringify(m,null,2));"

      - name: Restore or create keystore
        working-directory: android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore
          else
            keytool -genkeypair -v -keystore android.keystore -alias bfix \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
              -dname "CN=B-Fix Software, OU=Store, O=B-Fix Software, L=Sanaa, C=YE"
          fi

      - name: Build APK + AAB
        working-directory: android
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation

      - name: Export fingerprint & assetlinks
        working-directory: android
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias bfix -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep SHA256 | head -1 | awk '{print $2}')
          echo "SHA256: $FP" | tee fingerprint.txt
          cat > assetlinks.json <<JSON
          [{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.bfixsoftware.aistore","sha256_cert_fingerprints":["$FP"]}}]
          JSON
          base64 -w0 android.keystore > keystore.base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bfix-store-android
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
            android/assetlinks.json
            android/fingerprint.txt
            android/keystore.base64.txt
